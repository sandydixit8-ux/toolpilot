name: Keep converter warm

on:
  schedule:
    # Offset from keepalive.yml (*/5) so the two pings land on different
    # minutes and cover cron drift. Exercises the full Vercel->Render path.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping converter keepalive
        run: |
          code=$(curl -s -o /tmp/keepalive.out -w "%{http_code}" --max-time 55 https://www.toolpilotpro.in/api/keepalive/converter)
          echo "HTTP $code: $(cat /tmp/keepalive.out)"
          [ "$code" = "200" ]
