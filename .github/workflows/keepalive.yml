name: Render Keep-Alive

on:
  schedule:
    # Render free tier sleeps after ~15 min idle. GitHub cron is best-effort
    # and can drift, so ping every 5 min (min allowed) for safe margin.
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping document-converter health endpoint
        run: curl -fsS --max-time 60 "https://toolpilot-5b6c.onrender.com/health"