name: Render Keep-Alive

on:
  schedule:
    # Render free tier sleeps after ~15 min idle; ping every 10 min to stay warm.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping document-converter health endpoint
        run: curl -fsS --max-time 60 "https://toolpilot-5b6c.onrender.com/health"