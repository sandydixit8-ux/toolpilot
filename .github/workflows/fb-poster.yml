name: facebook-poster

on:
  schedule:
    # IST slots 06:00, 12:00, 18:00, 21:00 == UTC 00:30, 06:30, 12:30, 15:30
    - cron: "30 0,6,12,15 * * *"
  workflow_dispatch:

env:
  TZ: Asia/Kolkata

jobs:
  post:
    runs-on: ubuntu-latest
    if: ${{ secrets.FB_PAGE_ID != '' && secrets.FB_PAGE_ACCESS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Post to Facebook
        run: npx tsx scripts/fb-poster/post.ts
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}