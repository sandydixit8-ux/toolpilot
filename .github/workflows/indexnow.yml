name: indexnow-ping

on:
  schedule:
    # Daily, 02:30 UTC == 08:00 IST
    - cron: "30 2 * * *"
  workflow_dispatch:

env:
  TZ: Asia/Kolkata

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Submit sitemap URLs to IndexNow
        run: npx tsx scripts/indexnow-ping.ts
