name: Health check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run full health sweep
        run: |
          code=$(curl -s -o /tmp/health.out -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.HEALTH_CRON_SECRET }}" \
            --max-time 75 \
            https://www.toolpilotpro.in/api/admin/health/run)
          echo "HTTP $code"
          head -c 400 /tmp/health.out
          echo
          [ "$code" = "200" ]
